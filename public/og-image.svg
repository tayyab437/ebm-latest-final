<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="45%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient background glow elements -->
  <circle cx="1100" cy="120" r="320" fill="#2563EB" opacity="0.15" />
  <circle cx="100" cy="500" r="260" fill="#6366F1" opacity="0.12" />

  <!-- Decorative Border -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Top Badge -->
  <rect x="80" y="80" width="340" height="42" rx="21" fill="rgba(37,99,235,0.2)" stroke="#3B82F6" stroke-width="1.5" />
  <text x="250" y="107" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#93C5FD" letter-spacing="2">PERSONALIZED LEARNING PLATFORM</text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#FFFFFF" letter-spacing="-1">Ejaz Bukhari Method (EBM)</text>
  
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="url(#blueGlow)">Grade 1 to Cambridge O &amp; A Levels</text>

  <!-- Value Description -->
  <text x="80" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94A3B8" width="700">
    Evidence-based pedagogical framework integrating adaptive diagnostic baselines,
  </text>
  <text x="80" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    real-time cognitive analytics, and customized 1-on-1 academic acceleration.
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="220" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F8FAFC">⚡ Adaptive Diagnostics</text>

    <rect x="236" y="0" width="230" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="351" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F8FAFC">📊 Real-Time Analytics</text>

    <rect x="482" y="0" width="240" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="602" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F8FAFC">🎓 Cambridge Excellence</text>
  </g>

  <!-- Right Visual / Monogram Emblem -->
  <g transform="translate(940, 290)">
    <circle cx="0" cy="0" r="130" fill="url(#blueGlow)" opacity="0.15" />
    <circle cx="0" cy="0" r="100" fill="rgba(30, 58, 138, 0.6)" stroke="#3B82F6" stroke-width="3" />
    <text x="0" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="4">EBM</text>
    <text x="0" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="url(#goldText)" letter-spacing="2">EST. EXCELLENCE</text>
  </g>

  <!-- URL Brand Footer -->
  <text x="80" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#64748B" letter-spacing="1">ejazbukharimethod.com</text>
</svg>
